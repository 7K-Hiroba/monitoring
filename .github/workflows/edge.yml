name: edge
# Manual-only edge releases: decoupled from ordinary merges; dispatch is a
# separate explicit decision and is never triggered by a merge.
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: "hiroba-release-${{ github.repository }}", cancel-in-progress: false}
jobs:
  edge:
    uses: 7K-Hiroba/workflows/.github/workflows/edge.yml@c2432e1b186987ffdaa97f99b31b89b073c7a47e # v2.1.1
    with: {root: .}
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read, artifact-metadata: write}
