name: release-please
on: {push: {branches: [main]}}
permissions: {contents: read}
jobs:
  propose:
    uses: 7K-Hiroba/workflows/.github/workflows/release-please.yml@ee08d62cea303ecc75322044cb1e3cf5d214c041 # v1.1.0
    with: {root: ., app-id: "${{ vars.HIROBA_RELEASE_APP_ID }}"}
    secrets:
      release-private-key: "${{ secrets.HIROBA_RELEASE_PRIVATE_KEY }}"
    permissions: {contents: write, pull-requests: write}
