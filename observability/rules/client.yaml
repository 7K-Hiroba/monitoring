groups:
  - name: monitoring-client
    interval: 1m
    rules:
      - alert: MonitoringClientDown
        expr: up{org=~".+", cluster=~".+", job=~"alloy|kube-state-metrics|node-exporter", instance=~".+"} == 0
        for: 5m
        labels:
          severity: critical
          app: monitoring
        annotations:
          summary: Client telemetry collector is down
