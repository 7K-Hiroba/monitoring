topology: central
components:
  mimir: true
  alertmanager: true
  grafana: true
  loki: true
  alloy: true
  kubeStateMetrics: true
  nodeExporter: true
global:
  topology: central
  telemetry:
    org: ci
  collectors:
    kubelet:
      enabled: true
      insecureSkipVerify: true
    controlPlane:
      enabled: true
      insecureSkipVerify: true
      targets: []
mimir-distributed:
  minio:
    enabled: true
    resources: {requests: {cpu: 25m, memory: 64Mi}}
  rollout_operator:
    resources: {requests: {cpu: 10m, memory: 32Mi}}
  alertmanager:
    resources: {requests: {cpu: 10m, memory: 32Mi}}
  distributor:
    resources: {requests: {cpu: 10m, memory: 64Mi}}
  ingester:
    resources: {requests: {cpu: 10m, memory: 128Mi}}
  overrides_exporter:
    resources: {requests: {cpu: 10m, memory: 32Mi}}
  ruler:
    resources: {requests: {cpu: 10m, memory: 64Mi}}
  querier:
    resources: {requests: {cpu: 10m, memory: 64Mi}}
  query_frontend:
    resources: {requests: {cpu: 10m, memory: 64Mi}}
  query_scheduler:
    resources: {requests: {cpu: 10m, memory: 64Mi}}
  store_gateway:
    resources: {requests: {cpu: 10m, memory: 128Mi}}
  compactor:
    resources: {requests: {cpu: 10m, memory: 128Mi}}
  gateway:
    resources: {requests: {cpu: 10m, memory: 32Mi}}
loki:
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    resources: {requests: {cpu: 10m, memory: 32Mi}}
  loki:
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
  singleBinary:
    resources: {requests: {cpu: 25m, memory: 128Mi}}
    persistence:
      enabled: false
    extraVolumes:
      - name: loki-data
        emptyDir: {}
    extraVolumeMounts:
      - name: loki-data
        mountPath: /var/loki
grafana:
  persistence:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
prometheus-node-exporter:
  hostNetwork: false
  resources:
    requests: {cpu: 10m, memory: 32Mi}
observability:
  enabled: true
  rules:
    enabled: true
